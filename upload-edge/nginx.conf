# Публичный вход :8090. Браузер бьёт /{engine_id}/upload/v1/… (после NPM /u/b/ или /u/a/).
# Прокси только upload+health — /internal/v1 наружу не отдаём.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 0;
    client_body_timeout 3600s;

    map $http_origin $upload_cors {
        default "";
        "https://seedbox2.hw-s.ru" $http_origin;
        "https://seedbox.hw-s.ru" $http_origin;
        "https://192.168.1.101" $http_origin;
    }

    server {
        listen 8090;
        server_name _;

        add_header Access-Control-Allow-Origin $upload_cors always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,HEAD,OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /health {
            default_type application/json;
            return 200 '{"ok":true,"role":"upload-edge"}';
        }

        location ~ ^/(?<eid>[A-Za-z0-9][A-Za-z0-9._-]*)/health$ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $engine_host "${eid}-seeding";
            proxy_http_version 1.1;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
            proxy_set_header Host $engine_host;
            proxy_pass https://$engine_host:8081/health;
        }

        location ~ ^/(?<eid>[A-Za-z0-9][A-Za-z0-9._-]*)/upload/v1/(?<rest>.*)$ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $engine_host "${eid}-seeding";
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
            proxy_set_header Host $engine_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Upload-Ticket $http_x_upload_ticket;
            proxy_pass https://$engine_host:8081/upload/v1/$rest$is_args$args;
        }

        location ~ ^/(?<eid>[A-Za-z0-9][A-Za-z0-9._-]*)/download/v1/(?<rest>.*)$ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $engine_host "${eid}-seeding";
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
            proxy_set_header Host $engine_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Download-Ticket $http_x_download_ticket;
            proxy_pass https://$engine_host:8081/download/v1/$rest$is_args$args;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"upload-edge: use /{engine_id}/upload/v1/ or /download/v1/"}';
        }
    }
}
