# Тестовый upload sidecar на data-plane хосте (171 / 243).
# Монтируй те же тома/пути, что у движков. Пример для b-host:
#
#   export SEEDING_UPLOAD_TICKET_SECRET=...
#   docker compose -f docker-compose.upload.yml \
#     -f docker-compose.upload.b-host.example.yml up -d --build
#
# Прод-оверрей с реальными volume names — untracked на хосте.

name: seeding-upload

services:
  upload:
    build:
      context: ./upload
      dockerfile: Dockerfile
    container_name: seeding-upload
    restart: unless-stopped
    environment:
      SEEDING_UPLOAD_TICKET_SECRET: ${SEEDING_UPLOAD_TICKET_SECRET:-}
      UPLOAD_ENGINE_ROOTS: ${UPLOAD_ENGINE_ROOTS:-}
      UPLOAD_CHUNK_SIZE: ${UPLOAD_CHUNK_SIZE:-8388608}
      UPLOAD_GC_MINUTES: ${UPLOAD_GC_MINUTES:-30}
      UPLOAD_CORS_ORIGINS: ${UPLOAD_CORS_ORIGINS:-https://seedbox2.hw-s.ru,https://seedbox.hw-s.ru}
      # Всегда rudub/rudub2 (1000:1000) + mode 0644 после complete.
      UPLOAD_CONTENT_UID: ${UPLOAD_CONTENT_UID:-1000}
      UPLOAD_CONTENT_GID: ${UPLOAD_CONTENT_GID:-1000}
    ports:
      - "${UPLOAD_PUBLISH_PORT:-8090}:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
